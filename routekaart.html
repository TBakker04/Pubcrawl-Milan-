<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0E3B2C">
<title>Routekaart</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --paper: #F7F5F0; --ink: #13241C; --green: #0E3B2C; --red: #B5121B; --gold: #F2D16B; --muted: #4A5B53; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--green); color: var(--ink); font: 16px/1.45 'Archivo', Arial, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
  header { color: var(--paper); display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .kick { font-weight: 800; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
  h1 { margin: 0; font: 400 clamp(44px, 12vw, 72px)/.9 'Anton', Impact, sans-serif; }
  h1 span { color: var(--red); }
  header p { margin: 0; color: #C9D8D1; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 4px; }
  .bar a, .bar button { font: 800 14px/1 'Archivo', sans-serif; color: var(--ink); background: var(--paper); border: 0; border-radius: 999px; padding: 12px 16px; min-height: 44px; text-decoration: none; display: inline-flex; align-items: center; cursor: pointer; }
  .bar .alt { background: transparent; color: var(--paper); border: 2px solid rgba(247,245,240,.6); }
  #map { height: 340px; border-radius: 14px; margin: 14px 0 18px; border: 3px solid var(--paper); }
  ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  li.hole { background: var(--paper); border-radius: 12px; padding: 14px 14px 12px; display: grid; grid-template-columns: 44px 1fr; gap: 4px 12px; break-inside: avoid; }
  .num { grid-row: span 6; width: 40px; height: 40px; border-radius: 50%; background: var(--green); color: var(--paper); display: grid; place-items: center; font: 400 20px/1 'Anton', sans-serif; }
  .num.sp { background: var(--red); }
  .area { font-weight: 800; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .name { font: 400 24px/1 'Anton', sans-serif; text-transform: uppercase; }
  .tag { display: inline-block; margin-left: 6px; font: 800 10px/1 'Archivo', sans-serif; letter-spacing: .1em; color: #fff; background: var(--red); border-radius: 999px; padding: 4px 7px; vertical-align: middle; }
  a.addr { color: var(--ink); font-weight: 600; }
  .hours { font-size: 13px; color: var(--muted); }
  .res { font-size: 13px; margin-top: 4px; padding-top: 6px; border-top: 1px dashed rgba(19,36,28,.25); }
  .res a { color: var(--ink); }
  .res b { font-weight: 800; }
  li.move { color: var(--paper); font-weight: 700; font-size: 14px; text-align: center; opacity: .9; }
  footer { color: #A9BDB4; font-size: 13px; margin-top: 18px; }
  @media print {
    body { background: #fff; } header, footer { color: var(--ink); } header p, footer { color: var(--muted); }
    .bar, #map { display: none; } li.hole { border: 1px solid #ccc; padding: 8px 10px; } li.move { color: var(--ink); }
    .wrap { padding: 0; } h1 { font-size: 40px; }
  }
  .need { font-size: 17px; line-height: 1.5; padding: 16px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="kick" id="kick"></span>
    <h1>DE <span>ROUTEKAART</span></h1>
    <p>Alle 18 bars op volgorde, met adres. Tik op een adres om het in je kaart-app te openen. Is een bar dicht of te vol? Ga dan naar de reservebar eronder.</p>
    <div class="bar">
      <a id="dir1" target="_blank" rel="noopener"></a>
      <a id="dir2" target="_blank" rel="noopener"></a>
      <button type="button" class="alt" onclick="window.print()">Afdrukken / PDF</button>
    </div>
  </header>
  <div id="map" aria-label="Kaart van de route"></div>
  <ol id="list"></ol>
  <footer id="foot"></footer>
</div>
<script src="firebase-config.js"></script>
<script>
(function() {
  // Website version: stands in for Claude's runtime so the same game code runs on any web host.
  // Live data goes to Firebase Firestore when firebase-config.js holds a config; without one the
  // game still works, but only on each phone (status: "Alleen op deze telefoon").
  var V = '10.12.2', dbP = null;
  function load(src) { return new Promise(function(res, rej) { var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
  function firestore() {
    if (dbP) return dbP;
    var cfg = window.PC_FIREBASE;
    if (!cfg || !cfg.apiKey || !cfg.projectId) return dbP = Promise.resolve(null);
    dbP = load('https://www.gstatic.com/firebasejs/' + V + '/firebase-app-compat.js')
      .then(function() { return load('https://www.gstatic.com/firebasejs/' + V + '/firebase-firestore-compat.js'); })
      // App Check (when firebase-config.js has appCheckKey, a reCAPTCHA v3 site key): only this website may use the database
      .then(function() { return cfg.appCheckKey ? load('https://www.gstatic.com/firebasejs/' + V + '/firebase-app-check-compat.js').catch(function() {}) : null; })
      .then(function() {
        if (!window.firebase.apps.length) window.firebase.initializeApp(cfg);
        if (cfg.appCheckKey && window.firebase.appCheck) { try { window.firebase.appCheck().activate(cfg.appCheckKey, true); } catch (e) {} }
        var db = window.firebase.firestore();
        try { db.enablePersistence({ synchronizeTabs: true }).catch(function() {}); } catch (e) {}
        return db;
      })
      .catch(function() { return null; });
    return dbP;
  }
  // Photos: stored inside Firestore as small JPEGs (no paid Storage plan needed).
  function toDataUrl(blob) {
    return new Promise(function(res, rej) {
      var u = URL.createObjectURL(blob), img = new Image();
      img.onload = function() {
        var max = 900, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
        res(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = function() { URL.revokeObjectURL(u); rej(new Error('image')); };
      img.src = u;
    });
  }
  var assets = {
    upload: function(blob) { return toDataUrl(blob).then(function(url) { return { id: 'inline', url: url, sizeBytes: url.length, contentType: 'image/jpeg' }; }); },
    delete: function() { return Promise.resolve(); },
    list: function() { return Promise.resolve({ assets: [], usage: {} }); }
  };
  window.claude = {
    use: function(name) {
      if (name === 'db') return firestore();
      if (name === 'user') return Promise.resolve({ can: function() { return Promise.resolve(true); }, isOwner: function() { return Promise.resolve(false); }, canEdit: function() { return Promise.resolve(false); }, id: function() { return Promise.resolve(null); } });
      if (name === 'assets') return firestore().then(function(db) { return db ? assets : null; });
      return Promise.resolve(null);
    }
  };
})();

(function() {
  // Website only: the city content (route, bars, drinks, quiz, special holes, posters) is not in the page.
  // It sits in the database at games/<code>/kv/pack and only a valid game code can read it (firestore.rules).
  // The last pack is kept on the phone, so the game also opens without signal (but never after the server said no).
  window.PCLoadPack = function(code) {
    var K = 'pubcrawl-pack-' + code;
    function cached() { try { return JSON.parse(localStorage.getItem(K) || 'null'); } catch (e) { return null; } }
    function timeout(p, ms) { return Promise.race([p, new Promise(function(_, r) { setTimeout(function() { r({ code: 'timeout' }); }, ms); })]); }
    return window.claude.use('db').then(function(db) {
      if (!db) throw { code: 'offline' };
      return timeout(db.doc('games/' + code + '/kv/pack').get(), 9000);
    }).then(function(snap) {
      if (!snap || !snap.exists) throw { code: 'nopack' };
      var d = snap.data() || {}, p = typeof d.json === 'string' ? JSON.parse(d.json) : d.v;
      if (!p || !p.cfg) throw { code: 'nopack' };
      try { localStorage.setItem(K, JSON.stringify(p)); } catch (e) {}
      return p;
    }).catch(function(e) {
      var code = e && e.code;
      if (code === 'permission-denied') { try { localStorage.removeItem(K); } catch (x) {} throw e; }
      var c = cached(); if (c && c.cfg) return c;
      throw e;
    });
  };
  // put the pack into the page: city data into the config, posters into their places, English texts into the dictionary
  window.PCApplyPack = function(p) {
    var C = window.PC_CONFIG, k;
    for (k in p.cfg) C[k] = p.cfg[k];
    if (window.PC_EN && p.en) for (k in p.en) window.PC_EN[k] = p.en[k];
    if (window.PCTrConfig) window.PCTrConfig(C);
    Array.prototype.forEach.call(document.querySelectorAll('[data-pack]'), function(el) {
      var h = p.posters && p.posters[el.getAttribute('data-pack')];
      if (h != null) el.innerHTML = h;
    });
  };
})();

</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// the route itself comes from the database once the game code is confirmed (pack.js); without a valid code: nothing
window.PCRenderRoute = function() {
  var CFG = window.PC_CONFIG, holes = CFG.holes;
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, txt) { var x = document.createElement(tag); if (cls) x.className = cls; if (txt != null) x.textContent = txt; return x; }
  function maps(p) { return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.name + ', ' + p.address + ', ' + CFG.city); }
  function dir(a, b) {
    var pts = holes.slice(a - 1, b).map(function(h) { return h.lat + ',' + h.lng; });
    return 'https://www.google.com/maps/dir/?api=1&travelmode=walking&origin=' + pts[0] + '&destination=' + pts[pts.length - 1] + '&waypoints=' + encodeURIComponent(pts.slice(1, -1).join('|'));
  }
  var DAYS = window.PCLang && window.PCLang() === 'en' ? ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'] : ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'];
  // "ma–za 18:00–02:00 · zo dicht"
  function hoursText(hs) {
    if (!hs) return '';
    var groups = [];
    hs.forEach(function(v, i) { var g = groups[groups.length - 1]; if (g && g.v === v) g.to = i; else groups.push({ v: v, from: i, to: i }); });
    return groups.map(function(g) { var d = g.from === g.to ? DAYS[g.from] : DAYS[g.from] + '–' + DAYS[g.to]; return d + ' ' + (g.v ? g.v.replace(/-/g, '–').replace(/,/g, ', ') : PCT('dicht')); }).join(' · ');
  }
  document.title = PCT('Routekaart') + ' · ' + CFG.brand;
  $('kick').textContent = CFG.brand + ' · 18 holes';
  var N = holes.length, MID = Math.ceil(N / 2);
  $('dir1').href = dir(1, MID); $('dir1').textContent = PCT('Route hole {0}–{1}', 1, MID);
  $('dir2').href = dir(MID + 1, N); $('dir2').textContent = PCT('Route hole {0}–{1}', MID + 1, N);
  holes.forEach(function(h) {
    var li = el('li', 'hole');
    li.appendChild(el('span', 'num' + (h.special ? ' sp' : ''), h.n));
    li.appendChild(el('span', 'area', h.area || ''));
    var nm = el('span', 'name', h.name); if (h.special) nm.appendChild(el('span', 'tag', PCT(h.special))); li.appendChild(nm);
    var a = el('a', 'addr', h.address); a.href = maps(h); a.target = '_blank'; a.rel = 'noopener'; li.appendChild(a);
    if (h.hours) li.appendChild(el('span', 'hours', PCT('Open:') + ' ' + hoursText(h.hours)));
    if (h.reserve) {
      var r = el('div', 'res'); r.appendChild(el('b', '', PCT('Reservebar:') + ' '));
      var ra = el('a', '', h.reserve.name + ', ' + h.reserve.address); ra.href = maps(h.reserve); ra.target = '_blank'; ra.rel = 'noopener'; r.appendChild(ra);
      if (h.reserve.hours) r.appendChild(el('div', 'hours', PCT('Open:') + ' ' + hoursText(h.reserve.hours)));
      li.appendChild(r);
    }
    $('list').appendChild(li);
    if (h.transitAfter) $('list').appendChild(el('li', 'move', '↓ ' + h.transitAfter.note));
  });
  $('foot').textContent = PCT('Openingstijden: {0}. Ze kunnen veranderen, dus kijk bij twijfel even na.', CFG.hoursSource || '');
  // map: numbered dots for the route, small dots for the reserve bars
  try {
    var map = L.map('map', { scrollWheelZoom: false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
    var pts = holes.map(function(h) { return [h.lat, h.lng]; });
    L.polyline(pts, { color: '#B5121B', weight: 3, dashArray: '6 6' }).addTo(map);
    holes.forEach(function(h) {
      L.marker([h.lat, h.lng], { icon: L.divIcon({ className: '', html: '<div style="width:26px;height:26px;border-radius:50%;background:' + (h.special ? '#B5121B' : '#0E3B2C') + ';color:#fff;border:2px solid #fff;display:grid;place-items:center;font:700 12px Archivo,sans-serif">' + h.n + '</div>', iconSize: [26, 26], iconAnchor: [13, 13] }) }).addTo(map).bindPopup('<b>' + h.n + '. ' + h.name + '</b><br>' + h.address);
      if (h.reserve) L.circleMarker([h.reserve.lat, h.reserve.lng], { radius: 5, color: '#F2D16B', weight: 2, fillColor: '#13241C', fillOpacity: 1 }).addTo(map).bindPopup(PCT('Reservebar:') + ' <b>' + h.reserve.name + '</b><br>' + h.reserve.address);
    });
    map.fitBounds(pts, { padding: [20, 20] });
  } catch (e) { $('map').hidden = true; }
};
(function() {
  var CFG = window.PC_CONFIG, CITY = CFG.cityKey || 'milan', KEY = CITY === 'milan' ? 'pubcrawl-code' : 'pubcrawl-code-' + CITY;
  var q = /[?&]code=([^&#]*)/.exec(location.search), code = q ? decodeURIComponent(q[1]) : '';
  if (!code) { try { code = localStorage.getItem(KEY) || ''; } catch (e) {} }
  code = String(code).replace(/[^A-Za-z0-9-]/g, '').toUpperCase();
  document.getElementById('kick').textContent = CFG.brand;
  function fail(t) {
    var bar = document.querySelector('.bar'); if (bar) bar.style.display = 'none';
    document.getElementById('map').style.display = 'none';
    var p = document.createElement('p'); p.className = 'need'; p.textContent = t; document.getElementById('list').appendChild(p);
  }
  if (!code || !window.PCLoadPack) { fail(PCT('Open de routekaart via de link in je bevestiging of via het spel.')); return; }
  window.PCLoadPack(code).then(function(p) { window.PCApplyPack(p); window.PCRenderRoute(); }).catch(function(e) {
    fail(e && e.code === 'permission-denied' ? PCT('Deze code bestaat niet of is verlopen. Kijk hem nog eens na.') : PCT('Geen verbinding. Probeer het zo nog eens.'));
  });
})();
</script>
